server {
    listen 80;

    # React app: unknown paths fall back to index.html so /accuracy and /method work on refresh.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Backend API and its generated docs.
    location /api/ {
        proxy_pass http://backend:8000;
    }
    location = /docs {
        proxy_pass http://backend:8000;
    }
    location = /openapi.json {
        proxy_pass http://backend:8000;
    }
}
